<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Portfolio</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #ffffff;
            --accent-color: #58a6ff;
            --neon-green: #00ff87;
            --card-bg: #161b22;
            --border-color: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 24px; }
        .avatar {
            width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-color), var(--neon-green));
            margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
            font-size: 32px; box-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
        }
        h1 { font-size: 20px; margin: 0 0 8px 0; font-weight: 600; }
        .subtitle { font-size: 13px; color: #8b949e; margin: 0; }
        .section-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-color); margin: 24px 0 12px 0; font-weight: 600; }
        .services-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        .service-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; transition: all 0.25s ease; }
        .service-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .service-price { font-size: 14px; color: var(--neon-green); font-weight: 500; margin-bottom: 12px; }
        .btn-order { 
            width: 100%; 
            background: linear-gradient(90deg, #00ff87 0%, #60efff 100%); 
            color: #000; border: none; border-radius: 8px; 
            padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0, 255, 135, 0.2);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="avatar">👨‍💻</div>
        <h1 id="user-greeting">Студия Разработки</h1>
        <p class="subtitle">Создание современных Telegram ботов & Web Apps под ключ</p>
    </div>

    <div class="section-title">Наши услуги и цены</div>
    <div class="services-grid">
        <div class="service-card">
            <div class="service-title">🤖 Бот-визитка / Меню услуг</div>
            <div class="service-price">от 5 000 руб</div>
            <button class="btn-order" onclick="selectService('Бот-визитка')">Выбрать и заказать</button>
        </div>
        <div class="service-card">
            <div class="service-title">📊 Бот с Базой Данных / CRM воронка</div>
            <div class="service-price">от 12 000 руб</div>
            <button class="btn-order" onclick="selectService('Бот с Базой Данных')">Выбрать и заказать</button>
        </div>
        <div class="service-card">
            <div class="service-title">🌐 Современный Web App магазин</div>
            <div class="service-price">от 20 000 руб</div>
            <button class="btn-order" onclick="selectService('Web App Магазин')">Выбрать и заказать</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-greeting').innerText = `Привет, ${tg.initDataUnsafe.user.first_name}!`;
        }

        // При клике на услугу приложение просто мгновенно закрывается, 
        // не ломаясь об сетевые блокировки смартфона!
        function selectService(name) {
            tg.close();
        }
    </script>
</body>
</html>
