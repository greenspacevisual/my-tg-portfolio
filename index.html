<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0f141c;
            --text-color: #ffffff;
            --accent-color: #ff5858;
            --neon-blue: #00d2ff;
            --neon-green: #00ff87;
            --card-bg: #1a222d;
            --border-color: #2c3747;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 16px; box-sizing: border-box;
        }
        .header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(45deg, var(--neon-blue), var(--neon-green)); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .admin-info h1 { font-size: 18px; margin: 0; }
        .admin-info p { font-size: 12px; color: #8b949e; margin: 4px 0 0 0; }
        
        /* Сетка статистики */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; text-align: center; }
        .stat-val { font-size: 24px; font-weight: 700; color: var(--neon-green); margin-bottom: 4px; }
        .stat-val.blue { color: var(--neon-blue); }
        .stat-lbl { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Блок управления */
        .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--neon-blue); margin-bottom: 12px; font-weight: 600; }
        .control-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .btn-action { width: 100%; background: linear-gradient(90deg, #00d2ff 0%, #00ff87 100%); color: #000; border: none; border-radius: 8px; padding: 14px; font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
        .btn-action.red { background: linear-gradient(90deg, #ff5858 0%, #ffc837 100%); }
    </style>
</head>
<body>

    <div class="header">
        <div class="avatar">👑</div>
        <div class="admin-info">
            <h1 id="admin-name">Панель Администратора</h1>
            <p>Статус сервера: <span style="color: var(--neon-green); font-weight: bold;">ONLINE</span></p>
        </div>
    </div>

    <div class="section-title">Метрики Бота</div>
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-val">12</div>
            <div class="stat-lbl">Всего лидов</div>
        </div>
        <div class="stat-card">
            <div class="stat-val blue">45 000 ₽</div>
            <div class="stat-lbl">В обороте</div>
        </div>
        <div class="stat-card">
            <div class="stat-val">100%</div>
            <div class="stat-lbl">Конверсия</div>
        </div>
        <div class="stat-card">
            <div class="stat-val blue">0 мс</div>
            <div class="stat-lbl">Пинг API</div>
        </div>
    </div>

    <div class="section-title">Управление функциями</div>
    <div class="control-panel">
        <button class="btn-action" onclick="alert('Функция отправки рассылки активирована!')">📢 Сделать рассылку по БД</button>
        <button class="btn-action red" onclick="tg.close()">❌ Выйти из панели</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('admin-name').innerText = tg.initDataUnsafe.user.first_name + " (Admin)";
        }
    </script>
</body>
</html>
