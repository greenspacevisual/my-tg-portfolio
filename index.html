<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Portfolio & Brief</title>
    <!-- Подключаем официальный скрипт Telegram Web App API -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #ffffff;
            --accent-color: #58a6ff;
            --neon-green: #00ff87;
            --card-bg: #161b22;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-color), var(--neon-green));
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
        }

        h1 {
            font-size: 20px;
            margin: 0 0 8px 0;
            font-weight: 600;
        }

        .subtitle {
            font-size: 13px;
            color: #8b949e;
            margin: 0;
        }

        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin: 24px 0 12px 0;
            font-weight: 600;
        }

        /* Карточки услуг */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .service-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .service-card.selected {
            border-color: var(--neon-green);
            box-shadow: 0 0 12px rgba(0, 255, 135, 0.2);
            background-color: #1f2937;
        }

        .service-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .service-price {
            font-size: 13px;
            color: var(--neon-green);
            font-weight: 500;
        }

        /* Форма брифа */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 6px;
        }

        input, textarea {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(90deg, #00ff87 0%, #60efff 100%);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 4px 15px rgba(0, 255, 135, 0.3);
            transition: transform 0.1s;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="avatar">👨‍💻</div>
        <h1 id="user-greeting">Студия Разработки</h1>
        <p class="subtitle">Создание современных Telegram ботов & Web Apps под ключ</p>
    </div>

    <div class="section-title">Выбор типа проекта</div>
    <div class="services-grid">
        <div class="service-card" onclick="selectService(this, 'Бот-визитка / Автоматизация', 'от 5 000 руб')">
            <div class="service-title">🤖 Бот-визитка / Меню услуг</div>
            <div class="service-price">от 5 000 руб</div>
        </div>
        <div class="service-card" onclick="selectService(this, 'Сложный бот с БД / CRM', 'от 12 000 руб')">
            <div class="service-title">📊 Бот с Базой Данных / CRM воронка</div>
            <div class="service-price">от 12 000 руб</div>
        </div>
        <div class="service-card" onclick="selectService(this, 'Интерактивный Web App', 'от 20 000 руб')">
            <div class="service-title">🌐 Современный Web App магазин / Сервис</div>
            <div class="service-price">от 20 000 руб</div>
        </div>
    </div>

    <div class="section-title">Заполнение брифа</div>
    <div class="form-group">
        <label for="task">Что должен делать бот? (Краткое ТЗ)</label>
        <textarea id="task" placeholder="Например: Бот доставки еды, интеграция с сайтом..."></textarea>
    </div>

    <div class="form-group">
        <label for="budget">Ваш ориентировочный бюджет (руб / \$)</label>
        <input type="text" id="budget" placeholder="Например: 15000 руб или 200\$">
    </div>

    <div class="form-group">
        <label for="wishes">Дополнительные пожелания</label>
        <textarea id="wishes" placeholder="Сроки, дизайн, интеграции или оставьте пустым..."></textarea>
    </div>

    <button class="btn-submit" onclick="sendDataToTelegram()">Отправить заявку</button>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем приложение на весь экран

        // Подставляем имя пользователя из Telegram в шапку для эффекта "вау"
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-greeting').innerText = `Привет, ${tg.initDataUnsafe.user.first_name}!`;
        }

        let selectedServiceType = "Не выбран";

        function selectService(card, serviceName, price) {
            // Снимаем выделение со всех карточек
            document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
            // Выделяем текущую
            card.classList.add('selected');
            selectedServiceType = `${serviceName} (${price})`;
        }

        function sendDataToTelegram() {
            const task = document.getElementById('task').value.trim();
            const budget = document.getElementById('budget').value.trim();
            const wishes = document.getElementById('wishes').value.trim() || "Нет";

            if (!task || !budget) {
                alert("Пожалуйста, заполните поля ТЗ и Бюджет!");
                return;
            }

            // Формируем пакет данных в формате JSON
            const data = {
                service_type: selectedServiceType,
                task_description: task,
                budget: budget,
                wishes: wishes
            };

            // Отправляем данные в Telegram-бота
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
