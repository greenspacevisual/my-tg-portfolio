<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Live Feed</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0f141c;
            --text-color: #ffffff;
            --accent-color: #58a6ff;
            --neon-blue: #00d2ff;
            --neon-green: #00ff87;
            --card-bg: #1a222d;
            --border-color: #2c3747;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 16px; box-sizing: border-box;
        }
        .header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(45deg, var(--neon-blue), var(--neon-green)); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .admin-info h1 { font-size: 18px; margin: 0; }
        .admin-info p { font-size: 12px; color: #8b949e; margin: 4px 0 0 0; }
        
        .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--neon-blue); margin: 20px 0 12px 0; font-weight: 600; }
        
        /* Лента заказов */
        .orders-list { display: flex; flex-direction: column; gap: 12px; }
        .order-item { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px dashed #2c3747; padding-bottom: 8px; }
        .client-name { font-weight: 700; color: var(--neon-green); font-size: 15px; }
        .project-type { font-size: 12px; background: #233042; padding: 4px 8px; border-radius: 6px; color: #58a6ff; }
        .order-body { font-size: 14px; line-height: 1.5; color: #c9d1d9; }
        .order-meta { font-size: 13px; margin-top: 10px; color: #8b949e; display: flex; justify-content: space-between; }
        
        .empty-text { text-align: center; color: #8b949e; padding: 30px; font-size: 14px; background: var(--card-bg); border-radius: 12px; border: 1px dashed var(--border-color); }
        .btn-close { width: 100%; background-color: #21262d; color: #c9d1d9; border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 24px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="avatar">👑</div>
        <div class="admin-info">
            <h1 id="admin-name">Панель Управления</h1>
            <p>Живая лента лидов из Python бэкенда</p>
        </div>
    </div>

    <div class="section-title">🕒 Последние полученные заказы</div>
    <div class="orders-list" id="feed-container">
        <!-- Сюда JavaScript автоматически добавит заказы из бота -->
        <div class="empty-text">Новых заказов пока не поступало. Ждем лидов...</div>
    </div>

    <button class="btn-close" onclick="tg.close()">❌ Закрыть панель</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('admin-name').innerText = tg.initDataUnsafe.user.first_name + " (Admin)";
        }

        // ХИТРОСТЬ: Извлекаем массив заказов, который Python передал в URL в параметре tgWebAppStartParam
        // Telegram автоматически кладет значение параметра ?start=... в tg.initDataUnsafe.start_param
        if (tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
            try {
                // Декодируем Base64 строку с заказами
                const rawParam = tg.initDataUnsafe.start_param;
                // Заменяем безопасные символы обратно
                const base64Str = rawParam.replace(/-/g, '+').replace(/_/g, '/');
                const decodedText = decodeURIComponent(escape(atob(base64Str)));
                
                // Превращаем текст обратно в JS-массив объектов
                const orders = JSON.parse(decodedText);
                
                if (orders && orders.length > 0) {
                    const container = document.getElementById('feed-container');
                    container.innerHTML = ""; // Очищаем текст "Лента пуста"
                    
                    // Рендерим каждую карточку заказа на экране динамически!
                    orders.forEach((order, index) => {
                        const card = document.createElement('div');
                        card.className = 'order-item';
                        card.innerHTML = `
                            <div class="order-header">
                                <span class="client-name">👤 ${order.name}</span>
                                <span class="project-type">${order.type}</span>
                            </div>
                            <div class="order-body">
                                <strong>ТЗ:</strong> ${order.task}<br>
                                <strong>Пожелания:</strong> ${order.wishes}
                            </div>
                            <div class="order-meta">
                                <span>💰 Бюджет: <strong style="color:var(--neon-green)">${order.budget}</strong></span>
                                <span style="color:var(--neon-blue)">#${index + 1}</span>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (e) {
                console.error("Ошибка парсинга живой ленты: ", e);
            }
        }
    </script>
</body>
</html>
